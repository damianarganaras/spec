name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "PKG_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag a publicar: ${TAG} (version ${VERSION})"

      - run: npm ci

      - run: node --test test/*.test.js

      - name: Publish to npm (skipped if the version already exists)
        run: |
          if npm view "@ancleto/spec@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "ya publicado: ${PKG_VERSION} — se omite npm publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published tarball (patient, non-blocking)
        continue-on-error: true
        run: |
          URL="https://registry.npmjs.org/@ancleto/spec/-/spec-${PKG_VERSION}.tgz"
          for attempt in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
            if [ "$CODE" = "200" ]; then
              echo "tarball OK: $URL"
              exit 0
            fi
            echo "intento ${attempt}/12: HTTP ${CODE}"
            sleep 20
          done
          echo "::warning::el tarball de ${PKG_VERSION} todavia no es descargable; npm puede tardar en propagar. Verificalo mas tarde (no bloquea el Release)."

      - name: Create GitHub Release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release ${TAG} ya existe — se omite"
            exit 0
          fi
          NOTES=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')
          if [ -z "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
